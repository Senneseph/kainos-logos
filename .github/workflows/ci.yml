# Phase 0 CI gate (P0.10) — all later phases must keep this green.
#
# Container-first per ADR-0001/0010: the three checks (pytest, typecheck, lint)
# run inside the digest-pinned image via the Makefile, exactly as they run locally.
# The repo has no remote yet; this workflow is ready for when it does, and the
# local equivalent is:  make test && make lint && make typecheck && make bench

name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the pinned image (requirements.lock, pip-compiled hashes)
        run: make image

      - name: Test (in-container, fresh)
        run: make test

      - name: Lint (ruff, in-container)
        run: make lint

      - name: Typecheck (mypy strict, in-container)
        run: make typecheck

      - name: Harness smoke (phase 0 dummy experiment persists results/)
        run: make bench
